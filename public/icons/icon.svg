<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Graduation Cap & Attendance Graphic with Shadow -->
  <g filter="url(#dropShadow)" transform="translate(64, 60)">
    <!-- Cap Diamond (Top) -->
    <path d="M192 48 L352 128 L192 208 L32 128 Z" fill="#ffffff" />
    <!-- Cap Brim Ribbon Accent -->
    <path d="M192 78 L312 138 L192 198 L72 138 Z" fill="#e0e7ff" opacity="0.4" />
    
    <!-- Cap Skull Base -->
    <path d="M80 162 L80 248 C80 296, 304 296, 304 248 L304 162 L192 216 Z" fill="#e0e7ff" />

    <!-- Tassel String and Pendant -->
    <path d="M72 144 L40 216 L40 280" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="286" r="14" fill="#fbbf24" />
    <circle cx="192" cy="128" r="10" fill="#fbbf24" />
  </g>

  <!-- Green Attendance Check Badge -->
  <g filter="url(#dropShadow)" transform="translate(296, 296)">
    <circle cx="84" cy="84" r="76" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="12" />
    <!-- Checkmark -->
    <path d="M48 84 L74 110 L122 58" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

